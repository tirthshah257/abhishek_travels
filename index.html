                    {VEHICLES.map(v => (
                      <option key={v.id} value={v.id} className="bg-zinc-950 text-white">
                        {v.name} ({v.capacity})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Your Full Name *</label>
                    <input 
                      type="text" 
                      required
                      placeholder="e.g. Ramesh Patel" 
                      value={cName}
                      onChange={(e) => setCName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white placeholder-zinc-500 focus:outline-none transition-colors"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Mobile Number *</label>
                    <input 
                      type="tel" 
                      required
                      placeholder="e.g. 98250 45916" 
                      value={cPhone}
                      onChange={(e) => setCPhone(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white placeholder-zinc-500 focus:outline-none transition-colors"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Trip Type</label>
                    <select 
                      value={tType} 
                      onChange={(e) => setTType(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white focus:outline-none cursor-pointer"
                    >
                      <option value="Outstation Round Trip">Outstation Round Trip</option>
                      <option value="One Way Drop">One Way Drop</option>
                      <option value="Local Tour (8hr/80km)">Local Tour (8hr/80km)</option>
                      <option value="Airport Pickup / Drop">Airport Pickup / Drop</option>
                      <option value="Wedding / Corporate Bulk">Wedding / Corporate Bulk</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Pickup Date</label>
                    <input 
                      type="date" 
                      value={tDate}
                      onChange={(e) => setTDate(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white focus:outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Pickup City</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Ahmedabad, Airport" 
                      value={pCity}
                      onChange={(e) => setPCity(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white placeholder-zinc-500 focus:outline-none transition-colors"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Destination / Tour</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Somnath, Udaipur" 
                      value={dest}
                      onChange={(e) => setDest(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white placeholder-zinc-500 focus:outline-none transition-colors"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-bold text-zinc-300 mb-1.5 block">Special Requests (Optional)</label>
                  <textarea 
                    rows="2" 
                    placeholder="Luggage requirements, child seats, specific route preferences..." 
                    value={notes} 
                    onChange={(e) => setNotes(e.target.value)} 
                    className="w-full px-3.5 py-2 rounded-xl bg-zinc-900 border border-white/10 focus:border-amber-400 text-xs text-white placeholder-zinc-500 focus:outline-none transition-colors resize-none"
                  />
                </div>

                <div className="mt-2 flex flex-col gap-3">
                  <button 
                    type="submit" 
                    className="btn-shimmer w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold text-xs tracking-wide shadow-xl shadow-emerald-600/30 flex items-center justify-center gap-2 transition-transform hover:scale-[1.01]"
                  >
                    <IconMessageCircle size={18} />
                    <span>Send Booking Request on WhatsApp</span>
                  </button>

                  <div className="text-center text-xs text-zinc-400">
                    Or call directly: <a href={`tel:${COMPANY_INFO.phone}`} className="text-amber-400 font-bold hover:underline">{COMPANY_INFO.phoneDisplay}</a>
                  </div>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Mount to DOM fallback (only if Vite module didn't mount)
    setTimeout(() => {
      const rootEl = document.getElementById('root');
      if (rootEl && !window.__VITE_REACT_MOUNTED__) {
        const root = ReactDOM.createRoot(rootEl);
        root.render(<App />);
      }
    }, 100);
  </script>
</body>
</html>
